<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nosso Cantinho 💗</title>
    <style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #ffe6f0, #fff);
    text-align: center;
    margin: 0;
    padding: 0;
  }

  h1 {
    color: #d6336c;
    margin-top: 20px;
  }

  .galeria {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    padding: 20px;
  }

  .galeria img {
    width: 100%;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: transform 0.3s;
  }

  .galeria img:hover {
    transform: scale(1.05);
  }

  footer {
    margin: 20px;
    font-style: italic;
    color: #555;
  }
</style>
</head>
<body>
    <h1>Nosso Cantinho 💗</h1>

    <div class="galeria">
        <img src="Imagem1.jpg" alt="Nós dois juntos">
        <img src="Imagem2.jpg" alt="Passeio romântico">
        <img src="Imagem3.webp" alt="Selfie divertida">
        <img src="Imagem4.webp" alt="cada momento com você é especial">
        <img src="Imagem8.jpg" alt="Selfie divertida">
         <img src="Imagem9.jpg" alt="Selfie divertida">
          <img src="Imagem10.jpg" alt="Selfie divertida">
           <img src="Imagem11.jpg" alt="Selfie divertida">
            <img src="Imagem12.jpg" alt="Selfie divertida">
            <img src="Imagem13.jpg" alt="Selfie divertida">
             <img src="Imagem14.jpg" alt="Selfie divertida">
              <img src="15.jpg" alt="Selfie divertida">
               <img src="16.jpg" alt="Selfie divertida">

    </div>

    <footer>
        Cada momento ao seu lado é um pedaço de eternidade que guardo no coração 💕 💖

    </footer>
    <style>
footer {
    font-size: 50px;
    font-weight: bold;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    color: #ff6f91; /* aqui você escolhe a cor */
}
</style> 
</body>
</html>
